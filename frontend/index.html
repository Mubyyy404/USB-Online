<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>USB Sentinel</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI';
  background: radial-gradient(circle, #020617, #000);
  color: #e5e7eb;
}
.container {
  width: 400px;
  margin: 80px auto;
  padding: 30px;
  background: #020617;
  border-radius: 12px;
  box-shadow: 0 0 20px #0ff;
}
h2 { text-align: center; color: #22d3ee; }
input, button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 6px;
  border: none;
}
input {
  background: #020617;
  border: 1px solid #22d3ee;
  color: white;
}
button {
  background: #22d3ee;
  color: black;
  font-weight: bold;
  cursor: pointer;
}
button:hover { background: #06b6d4; }
.hidden { display: none; }
table {
  width: 100%;
  border-collapse: collapse;
}
td, th {
  border: 1px solid #22d3ee;
  padding: 8px;
}
</style>
</head>

<body>

<div class="container" id="auth">
  <h2>USB Sentinel</h2>
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <button onclick="register()">Register</button>
</div>

<div class="container hidden" id="dash">
  <h2>Dashboard</h2>

  <h3>USB Logs</h3>
  <table id="usb"></table>

  <h3>Sandbox Results</h3>
  <table id="sandbox"></table>
</div>

<script>
const API = "http://127.0.0.1:5000";

function login() {
  fetch(API + "/login", {
    method: "POST",
    credentials: "include",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({username:user.value, password:pass.value})
  }).then(r => {
    if (r.ok) loadDash();
    else alert("Login failed");
  });
}

function register() {
  fetch(API + "/register", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({username:user.value, password:pass.value})
  }).then(r => alert(r.ok ? "Registered" : "User exists"));
}

function loadDash() {
  fetch(API + "/dashboard", {credentials:"include"})
  .then(r => r.json())
  .then(data => {
    auth.classList.add("hidden");
    dash.classList.remove("hidden");

    usb.innerHTML = "<tr><th>Event</th><th>Device</th><th>Time</th></tr>";
    data.usb.forEach(e =>
      usb.innerHTML += `<tr><td>${e[0]}</td><td>${e[1]}</td><td>${e[2]}</td></tr>`
    );

    sandbox.innerHTML = "<tr><th>File</th><th>Result</th><th>Time</th></tr>";
    data.sandbox.forEach(s =>
      sandbox.innerHTML += `<tr><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td></tr>`
    );
  });
}
</script>

</body>
</html>
