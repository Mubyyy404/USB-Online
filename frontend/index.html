<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberMonitor Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f1a;
  color: #00ffe1;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background: #0f172a;
  padding: 30px;
  width: 320px;
  border-radius: 8px;
  box-shadow: 0 0 15px #00ffe1;
}

h2 {
  text-align: center;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 12px;
  background: #020617;
  border: 1px solid #00ffe1;
  color: #00ffe1;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 10px;
  font-weight: bold;
  background: #00ffe1;
  border: none;
  cursor: pointer;
}

button:hover {
  background: #00cbb8;
}

.switch {
  text-align: center;
  margin-top: 15px;
  cursor: pointer;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">
  <h2 id="title">Login</h2>

  <form onsubmit="login(event)" id="loginForm">
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <form onsubmit="register(event)" id="registerForm" style="display:none;">
    <input id="regEmail" type="email" placeholder="Email" required>
    <input id="regPassword" type="password" placeholder="Password" required>
    <button type="submit">Register</button>
  </form>

  <div class="switch" onclick="toggleForm()">Switch to Register / Login</div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCIY6AiBsGrq7wM0BBYGW2lM_0FLWjnH0k",
  authDomain: "cybermonitor-1ab3c.firebaseapp.com",
  projectId: "cybermonitor-1ab3c",
  storageBucket: "cybermonitor-1ab3c.firebasestorage.app",
  messagingSenderId: "569408987884",
  appId: "1:569408987884:web:0839eb7932c206fc157bc9"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login(event) {
  event.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
    .then(() => {
      window.location.href = "dashboard.html";
    })
    .catch(err => alert(err.message));
}

function register(event) {
  event.preventDefault();

  const email = document.getElementById("regEmail").value;
  const password = document.getElementById("regPassword").value;

  auth.createUserWithEmailAndPassword(email, password)
    .then(() => {
      alert("Registration successful. Please login.");
      toggleForm();
    })
    .catch(err => alert(err.message));
}

function toggleForm() {
  const login = document.getElementById("loginForm");
  const reg = document.getElementById("registerForm");
  const title = document.getElementById("title");

  if (login.style.display === "none") {
    login.style.display = "block";
    reg.style.display = "none";
    title.innerText = "Login";
  } else {
    login.style.display = "none";
    reg.style.display = "block";
    title.innerText = "Register";
  }
}
</script>

</body>
</html>
