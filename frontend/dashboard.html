<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberMonitor Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #020617;
  color: #00ffe1;
}

header {
  background: #0f172a;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  box-shadow: 0 0 10px #00ffe1;
}

button {
  background: #00ffe1;
  border: none;
  padding: 6px 14px;
  cursor: pointer;
}

main {
  padding: 30px;
}
</style>
</head>

<body>

<header>
  <div>🛡 CyberMonitor Dashboard</div>
  <div>
    <span id="email"></span>
    <button onclick="logout()">Logout</button>
  </div>
</header>

<main>
  <h2>Welcome</h2>
  <p>USB monitoring system active.</p>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCIY6AiBsGrq7wM0BBYGW2lM_0FLWjnH0k",
  authDomain: "cybermonitor-1ab3c.firebaseapp.com",
  projectId: "cybermonitor-1ab3c",
  storageBucket: "cybermonitor-1ab3c.firebasestorage.app",
  messagingSenderId: "569408987884",
  appId: "1:569408987884:web:0839eb7932c206fc157bc9"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

auth.onAuthStateChanged(user => {
  if (!user) {
    window.location.href = "index.html";
  } else {
    document.getElementById("email").innerText = user.email;
  }
});

function logout() {
  auth.signOut().then(() => {
    window.location.href = "index.html";
  });
}
</script>

</body>
</html>
