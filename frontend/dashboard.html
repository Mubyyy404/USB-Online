<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber USB Sentinel Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<style>
/* ---------------- Modern Cyber UI ---------------- */
body {
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: #0d0d0d;
  color: #fff;
}
.navbar {
  height: 60px;
  background: #111;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px;
  box-shadow: 0 0 15px #0ff;
}
.navbar .hamburger {
  cursor: pointer;
  font-size: 24px;
  color: #0ff;
}
.navbar .user-profile {
  position: relative;
  cursor: pointer;
}
.user-dropdown {
  position: absolute;
  right:0;
  top:60px;
  background:#111;
  border:1px solid #0ff;
  display:none;
  min-width:220px;
  z-index:100;
  border-radius:6px;
  overflow:hidden;
}
.user-dropdown a {
  display:block;
  padding:12px 15px;
  color:#0ff;
  text-decoration:none;
  font-size:14px;
}
.user-dropdown a:hover {
  background:#0ff;
  color:#111;
}
.sidebar {
  width:250px;
  height:100vh;
  background:#111;
  position:fixed;
  top:0;
  left:-250px;
  transition:0.3s;
  border-right:1px solid #0ff;
  padding-top:60px;
  z-index:50;
}
.sidebar a {
  display:block;
  padding:15px 20px;
  color:#0ff;
  text-decoration:none;
  font-weight:bold;
}
.sidebar a:hover {
  background:#0ff;
  color:#111;
}
.main {
  margin-left:0;
  padding:20px;
  transition: margin-left 0.3s;
}
.card {
  background:#1a1a1a;
  border:1px solid #0ff;
  padding:20px;
  margin-bottom:20px;
  border-radius:10px;
  box-shadow: 0 0 20px #0ff40a10;
}
.table-container {
  overflow-x:auto;
}
table {
  width:100%;
  border-collapse: collapse;
}
th,td {
  padding:10px;
  text-align:left;
  border-bottom:1px solid #0ff;
}
th {
  background:#111;
}
button {
  background:#0ff;
  color:#111;
  border:none;
  padding:10px 20px;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
}
button:hover {
  background:#00cccc;
}
h1,h2 {
  color:#0ff;
  margin-bottom:10px;
}
</style>
</head>
<body>

<div class="navbar">
  <div class="hamburger" onclick="toggleSidebar()">☰</div>
  <div class="user-profile" onclick="toggleUserDropdown()">👤 <span id="userName">User</span>
    <div class="user-dropdown" id="userDropdown">
      <a id="profileName">Name: </a>
      <a id="profileEmail">Email: </a>
      <a href="#" onclick="changePassword()">Change Password</a>
      <a href="#" onclick="logout()">Logout</a>
    </div>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <a href="#">Dashboard Home</a>
  <a href="#">USB Logs</a>
  <a href="#" onclick="downloadAgent()">Download Agent</a>
  <a href="#">Sandbox Simulation</a>
  <a href="#">Reports</a>
  <a href="#">Settings</a>
</div>

<div class="main" id="mainContent">
  <h1>Welcome, <span id="welcomeUser">User</span></h1>
  
  <div class="card">
    <h2>Live USB Logs</h2>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Device</th>
            <th>Serial</th>
            <th>Action</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="usbLogs">
          <tr><td colspan="5">Loading logs...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>Agent Download</h2>
    <button onclick="downloadAgent()">Download USB Sentinel Agent</button>
  </div>
</div>

<script>
// ---------------- Firebase Setup ----------------
const firebaseConfig = {
  apiKey: "AIzaSyCIY6AiBsGrq7wM0BBYGW2lM_0FLWjnH0k",
  authDomain: "cybermonitor-1ab3c.firebaseapp.com",
  projectId: "cybermonitor-1ab3c",
  storageBucket: "cybermonitor-1ab3c.appspot.com",
  messagingSenderId: "569408987884",
  appId: "1:569408987884:web:0839eb7932c206fc157bc9",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ---------------- Sidebar ----------------
function toggleSidebar(){
  let sb = document.getElementById("sidebar");
  let main = document.getElementById("mainContent");
  if(sb.style.left === "0px"){
    sb.style.left = "-250px";
    main.style.marginLeft = "0";
  }else{
    sb.style.left = "0px";
    main.style.marginLeft = "250px";
  }
}

// ---------------- User Dropdown ----------------
function toggleUserDropdown(){
  let dropdown = document.getElementById("userDropdown");
  dropdown.style.display = (dropdown.style.display==="block")?"none":"block";
}

// ---------------- Firebase Auth ----------------
auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("welcomeUser").innerText = user.displayName||user.email;
    document.getElementById("userName").innerText = user.displayName||user.email;
    document.getElementById("profileName").innerText = "Name: " + (user.displayName||user.email);
    document.getElementById("profileEmail").innerText = "Email: " + user.email;
    loadUSBLogs();
  }else{
    window.location.href = "index.html"; // redirect to login if not logged in
  }
});

// ---------------- Load USB Logs ----------------
function loadUSBLogs(){
  const tbody = document.getElementById("usbLogs");
  tbody.innerHTML = "<tr><td colspan='5'>Loading logs...</td></tr>";
  db.collection("usb_logs").orderBy("time","desc").limit(50)
    .onSnapshot(snapshot=>{
      tbody.innerHTML = "";
      snapshot.forEach(doc=>{
        const data = doc.data();
        const row = `<tr>
          <td>${data.user||""}</td>
          <td>${data.device||""}</td>
          <td>${data.serial||""}</td>
          <td>${data.action||""}</td>
          <td>${data.time||""}</td>
        </tr>`;
        tbody.innerHTML += row;
      });
    });
}

// ---------------- Download Agent ----------------
function downloadAgent(){
  // Replace with your actual EXE download URL from Firebase Storage
  window.open("https://firebasestorage.googleapis.com/v0/b/cybermonitor-1ab3c.appspot.com/o/sentinel_agent.exe?alt=media","_blank");
}

// ---------------- Change Password & Logout ----------------
function changePassword(){
  const user = auth.currentUser;
  if(user){
    const newPass = prompt("Enter new password:");
    if(newPass) user.updatePassword(newPass).then(()=>alert("Password updated!")).catch(e=>alert(e.message));
  }
}
function logout(){
  auth.signOut().then(()=>window.location.href="index.html");
}
</script>

</body>
</html>
