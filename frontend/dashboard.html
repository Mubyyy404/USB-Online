<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberMonitor Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: "Segoe UI", Arial;
  background: #0b0f1a;
  color: #00ffe1;
}

header {
  background: #0f172a;
  padding: 15px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 0 10px #00ffe1;
}

h1 {
  margin: 0;
  font-size: 22px;
}

.user {
  font-size: 14px;
}

button {
  background: #00ffe1;
  border: none;
  padding: 8px 16px;
  cursor: pointer;
  font-weight: bold;
  border-radius: 4px;
}

button:hover {
  background: #00cbb8;
}

main {
  padding: 30px;
}

.card {
  background: #0f172a;
  border-left: 4px solid #00ffe1;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 0 8px #00ffe1;
}
</style>
</head>

<body>

<header>
  <h1>🛡 CyberMonitor Dashboard</h1>
  <div class="user">
    <span id="userEmail">Loading...</span>
    <button onclick="logout()">Logout</button>
  </div>
</header>

<main>
  <div class="card">
    <h2>🔌 USB Activity</h2>
    <p>Waiting for agent data...</p>
  </div>

  <div class="card">
    <h2>📊 System Status</h2>
    <p>Monitoring active</p>
  </div>
</main>

<!-- FIREBASE SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCIY6AiBsGrq7wM0BBYGW2lM_0FLWjnH0k",
  authDomain: "cybermonitor-1ab3c.firebaseapp.com",
  projectId: "cybermonitor-1ab3c",
  storageBucket: "cybermonitor-1ab3c.firebasestorage.app",
  messagingSenderId: "569408987884",
  appId: "1:569408987884:web:0839eb7932c206fc157bc9"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// 🔐 AUTH CHECK
auth.onAuthStateChanged(user => {
  if (!user) {
    window.location.href = "index.html";
  } else {
    document.getElementById("userEmail").innerText = user.email;
  }
});

// 🚪 LOGOUT
function logout() {
  auth.signOut().then(() => {
    window.location.href = "index.html";
  });
}
</script>

</body>
</html>
