<!DOCTYPE html>
<html>
<head>
  <title>Cyber USB Monitor – Login</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <style>
    body{font-family:Arial;background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;height:100vh}
    .card{background:#020617;padding:30px;border-radius:12px;box-shadow:0 0 25px #38bdf8}
    input{padding:10px;margin:10px;width:100%;}
    button{padding:10px 20px;background:#38bdf8;border:none;color:black;font-weight:bold;border-radius:6px;cursor:pointer}
  </style>
</head>

<body>

<div class="card">
  <h2>Cyber USB Monitor</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <p id="msg"></p>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCIY6AiBsGrq7wM0BBYGW2lM_0FLWjnH0k",
  authDomain: "cybermonitor-1ab3c.firebaseapp.com",
  projectId: "cybermonitor-1ab3c",
  storageBucket: "cybermonitor-1ab3c.appspot.com",
  messagingSenderId: "569408987884",
  appId: "1:569408987884:web:0839eb7932c206fc157bc9",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login(){
  const email=document.getElementById("email").value;
  const pass=document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email,pass)
    .then(()=>{window.location="dashboard.html"})
    .catch(e=>document.getElementById("msg").innerText=e.message);
}

</script>
</body>
</html>
