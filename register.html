<!DOCTYPE html>
<html>
<head>
  <title>Cyber USB Monitor – Register</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

  <style>
    body{font-family:Arial;background:#020617;color:white;display:flex;justify-content:center;align-items:center;height:100vh}
    .box{background:#020617;padding:30px;border-radius:14px;box-shadow:0 0 25px #22c55e}
    input{width:100%;padding:10px;margin:10px;border-radius:6px;border:1px solid #1e293b;background:#020617;color:white}
    button{padding:10px 20px;background:#22c55e;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
    a{color:#38bdf8}
  </style>
</head>

<body>

<div class="box">
  <h2>Create Account</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="register()">Register</button>

  <p id="msg"></p>

  <p>Already have account? <a href="index.html">Login</a></p>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCIY6AiBsGrq7wM0BBYGW2lM_0FLWjnH0k",
  authDomain: "cybermonitor-1ab3c.firebaseapp.com",
  projectId: "cybermonitor-1ab3c",
  storageBucket: "cybermonitor-1ab3c.appspot.com",
  messagingSenderId: "569408987884",
  appId: "1:569408987884:web:0839eb7932c206fc157bc9",
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();

function register(){
  const e=document.getElementById("email").value;
  const p=document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(e,p)
    .then(()=>location="dashboard.html")
    .catch(err=>document.getElementById("msg").innerText=err.message);
}
</script>

</body>
</html>
