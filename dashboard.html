<!DOCTYPE html>
<html>
<head>
<title>USB Security Dashboard</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>
body{background:#0b1220;color:white}
.card{background:#111b2e;border-radius:18px}
.badge{font-size:14px}
</style>
</head>

<body class="p-4">

<h2>🛡 Cyber USB Monitor – Dashboard</h2>
<hr>

<div id="statusBanner" class="alert alert-warning">
Checking agent connection…
</div>

<div class="row g-3">

<div class="col-md-4">
<div class="card p-3">
<h5>Agent Status</h5>
<p>Status: <span id="agentStatus" class="badge bg-secondary">Checking…</span></p>
<p>Machine: <span id="machineName">-</span></p>
<p>Last Seen: <span id="lastSeen">-</span></p>

<button class="btn btn-success w-100" onclick="downloadAgent()">Download Python Agent</button>
<br><br>
<button class="btn btn-primary w-100" onclick="downloadBAT()">Download Auto-Start BAT</button>

</div>
</div>

<div class="col-md-4">
<div class="card p-3">
<h5>Connected USB Devices</h5>
<ul id="usbList"></ul>
</div>
</div>

<div class="col-md-4">
<div class="card p-3">
<h5>Actions</h5>
<button class="btn btn-danger w-100">Block Unknown Devices</button><br><br>
<button class="btn btn-warning w-100">Whitelist Current USB</button><br><br>
<button class="btn btn-info w-100">Enable Email Alerts</button>
</div>
</div>

</div>

<br>

<div class="card p-3">
<h5>Event Logs</h5>
<table class="table table-dark table-striped">
<thead>
<tr>
<th>Device</th><th>Serial</th><th>Action</th><th>Severity</th><th>Time</th>
</tr>
</thead>
<tbody id="logTable"></tbody>
</table>
</div>

<script>
// ---------------- Firebase Setup ----------------
const firebaseConfig = {
  apiKey: "AIzaSyCIY6AiBsGrq7wM0BBYGW2lM_0FLWjnH0k",
  authDomain: "cybermonitor-1ab3c.firebaseapp.com",
  projectId: "cybermonitor-1ab3c",
  storageBucket: "cybermonitor-1ab3c.appspot.com",
  messagingSenderId: "569408987884",
  appId: "1:569408987884:web:0839eb7932c206fc157bc9",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ---------- Agent Download Buttons ---------
function downloadAgent(){
  window.location.href = "monitor.py";
}
function downloadBAT(){
  window.location.href = "install.bat";
}

// ---------- Status + Logs Live Listener ----------
auth.onAuthStateChanged(user=>{
 if(!user) {
   window.location = "login.html";
   return;
 }

 const uid = user.uid;

 db.collection("users").doc(uid).onSnapshot(doc=>{

   if(!doc.exists || !doc.data().status){
     document.getElementById("agentStatus").className="badge bg-warning";
     document.getElementById("agentStatus").innerText="Checking…";
     return;
   }

   const s = doc.data().status;

   document.getElementById("machineName").innerText = s.machine || "-";
   document.getElementById("lastSeen").innerText = new Date(s.last_seen*1000).toLocaleString();

   if(s.online){
     document.getElementById("agentStatus").className="badge bg-success";
     document.getElementById("agentStatus").innerText="Online";
     document.getElementById("statusBanner").className="alert alert-success";
     document.getElementById("statusBanner").innerText="Agent connected";
   }else{
     document.getElementById("agentStatus").className="badge bg-danger";
     document.getElementById("agentStatus").innerText="Offline";
   }

   const list=document.getElementById("usbList");
   list.innerHTML="";
   (s.usb_devices||[]).forEach(d=>{
     list.innerHTML+=`<li>${d.device_name} — ${d.serial}</li>`;
   });

 });

 // --------- Live logs table ----------
 db.collection("users").doc(uid).collection("logs")
 .orderBy("timestamp","desc")
 .limit(20)
 .onSnapshot(snap=>{
  const t=document.getElementById("logTable");
  t.innerHTML="";
  snap.forEach(doc=>{
    const d=doc.data();
    t.innerHTML+=`
     <tr>
      <td>${d.device_name}</td>
      <td>${d.device_serial}</td>
      <td>${d.action}</td>
      <td>${d.severity}</td>
      <td>${new Date(d.timestamp*1000).toLocaleString()}</td>
     </tr>`;
  });
 });

});
</script>

</body>
</html>
